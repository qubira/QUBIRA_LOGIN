<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUBIRA | Selección de módulo</title>
<link rel="icon" href="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #111827;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --primary-light: #eef2ff;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --border: #e2e4e9;
    --text: #111827;
    --text-muted: #6b7280;
    --gray-bg: #f3f4f6;
    --danger: #dc2626;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(17,24,39,.05);
    --shadow-hover: 0 8px 18px rgba(17,24,39,.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  /* El header y la franja "Selecciona una plataforma" quedan fijos — solo
     el contenido de <main> (agenda + módulos) scrollea, igual que el
     patrón ya usado dentro de los paneles (ADG/TI/etc. con su propio
     #main overflow-y:auto). min-height:0 es necesario para que un hijo
     flex pueda encogerse por debajo de su contenido y así sí scrollear
     en vez de empujar la altura del body. */
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(20px, 4vw, 44px);
    background: var(--sidebar-bg); color: #fff;
  }
  header::after { content: none; }
  .header-accent { height: 3px; background: linear-gradient(90deg, var(--primary), #818cf8 45%, var(--primary)); }

  .brand-wrap { position: relative; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 16px 6px 7px; border-radius: 11px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
    color: inherit; text-decoration: none; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .brand:hover, .brand:focus-visible { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.24); transform: translateY(-1px); }
  .brand img { width: 34px; height: 34px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,.08); padding: 5px; }
  .brand strong { font-size: 15px; letter-spacing: .04em; font-weight: 700; }
  .brand span { display: block; font-size: 10px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; margin-top: 1px; }
  .brand__go { margin-left: 2px; color: rgba(255,255,255,.4); display: flex; }

  /* Vista previa en vivo del sitio público — un iframe real escalado
     hacia abajo (lo renderiza a tamaño completo y lo achica con CSS,
     truco estándar para "miniaturizar" una página sin un servicio de
     capturas aparte) dentro de una tarjeta que aparece al pasar el
     mouse o enfocar el botón con teclado. El iframe nunca recibe
     clics (pointer-events:none): la tarjeta entera es un link propio
     al mismo sitio. */
  .brand-preview {
    position: absolute; top: calc(100% + 10px); left: 0; width: 340px;
    background: #fff; border-radius: 14px; border: 1px solid var(--border);
    box-shadow: 0 24px 48px rgba(17,24,39,.32);
    opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    z-index: 60; overflow: hidden; text-decoration: none; display: block;
  }
  .brand-wrap:hover .brand-preview,
  .brand-wrap:focus-within .brand-preview { opacity: 1; visibility: visible; transform: translateY(0); }
  .brand-preview__frame { display: block; width: 100%; height: 191px; overflow: hidden; position: relative; background: #0a0b0f; }
  .brand-preview__frame iframe {
    position: absolute; top: 0; left: 0; width: 1360px; height: 764px;
    transform: scale(.25); transform-origin: top left; border: 0; pointer-events: none;
  }
  .brand-preview__caption {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px; font-size: 11.5px; font-weight: 700; color: var(--primary);
  }

  .session { display: flex; align-items: center; gap: 14px; }
  .session .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.15);
  }
  .session .who { display: flex; flex-direction: column; gap: 1px; text-align: right; }
  .session .who strong { font-size: 12.5px; font-weight: 600; }
  .session .who span { font-size: 10.5px; color: rgba(255,255,255,.45); }

  /* ---------- Buttons (mismo sistema que el resto de los paneles) ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px; border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s;
    font-family: inherit; white-space: nowrap;
  }
  .btn-outline-light { background: transparent; color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.22); }
  .btn-outline-light:hover { background: rgba(220,38,38,.14); border-color: rgba(220,38,38,.4); color: #fca5a5; }

  /* ---------- Page header ---------- */
  .page-head {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: clamp(16px, 2.4vh, 24px) 20px;
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 16px 16px;
    background-position: -8px -8px;
  }
  .page-head .inner {
    max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .page-head .tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--primary-dark); background: var(--primary-light); border: 1px solid #c7d2fe;
    padding: 4px 10px; border-radius: 999px; margin-bottom: 8px;
  }
  .page-head .tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--success, #059669); }
  .page-head h1 { font-size: 20px; font-weight: 800; letter-spacing: -.015em; margin-bottom: 3px; }
  .page-head p { color: var(--text-muted); font-size: 12.5px; max-width: 480px; }
  .page-head .stat {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 18px; text-align: center; box-shadow: var(--shadow); flex-shrink: 0;
  }
  .page-head .stat strong { display: block; font-size: 20px; font-weight: 800; color: var(--primary); line-height: 1; }
  .page-head .stat span { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

  /* ---------- Modules ---------- */
  main { flex: 1; min-height: 0; overflow-y: auto; padding: clamp(16px, 2.4vh, 24px) 20px; }
  .section-wrap { max-width: 1200px; margin: 0 auto; }

  /* Agenda (izquierda) + módulos (derecha) — en pantallas angostas se
     apilan en una sola columna, con la agenda primero (mismo orden que
     en el DOM) porque es lo más urgente de revisar al entrar. */
  .hub-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .hub-layout { grid-template-columns: 1fr; } }

  .agenda-panel {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 18px; position: sticky; top: 16px;
  }
  .agenda-panel__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .agenda-panel h2 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .agenda-panel__today { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
  .agenda-day + .agenda-day { margin-top: 14px; }
  .agenda-day__label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--primary-dark); margin-bottom: 7px;
  }
  .agenda-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 10px; background: var(--gray-bg); }
  .agenda-item + .agenda-item { margin-top: 6px; }
  .agenda-item__time { font-size: 11px; font-weight: 700; color: var(--primary); white-space: nowrap; flex-shrink: 0; padding-top: 1px; }
  .agenda-item__title { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .agenda-item__meta { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
  .agenda-empty, .agenda-error, .agenda-loading { font-size: 12px; color: var(--text-muted); padding: 6px 2px; }

  /* Flex centrado en vez de grid: con un número de tarjetas que no es
     múltiplo exacto de columnas, la última fila queda centrada en vez
     de pegada a la izquierda con un hueco enorme a la derecha (lo que
     pasaba con grid-template-columns + auto-fit a ancho fijo). */
  .modules {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 18px;
  }
  .module-card {
    --accent: var(--primary);
    --accent-light: var(--primary-light);
    position: relative;
    flex: 1 1 260px; max-width: 280px;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); text-align: left; cursor: pointer;
    transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
    font: inherit; color: inherit;
  }
  .module-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, white));
  }
  .module-card:not(:disabled):hover { box-shadow: 0 16px 32px -8px rgba(17,24,39,.16); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); transform: translateY(-4px); }
  .module-card:not(:disabled):hover .module-icon { transform: scale(1.08) rotate(-2deg); }
  .module-card:not(:disabled):hover .module-card__enter { background: var(--accent); color: #fff; }
  .module-card:not(:disabled):hover .module-card__enter span { transform: translateX(3px); }
  .module-card:disabled { cursor: not-allowed; opacity: .72; }
  .module-card:not(:disabled):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .module-card__banner {
    padding: 22px 18px 14px; display: flex; align-items: flex-start; justify-content: space-between;
  }
  .module-icon {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(145deg, var(--accent-light), color-mix(in srgb, var(--accent-light) 60%, white));
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
    transition: transform .2s ease;
  }
  .module-icon svg { width: 22px; height: 22px; }
  .module-card__status {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent);
    background: var(--accent-light);
    display: flex; align-items: center; gap: 4px;
    padding: 4px 9px; border-radius: 999px; margin-top: 2px;
  }
  .module-card__status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .module-card:disabled .module-icon { background: var(--gray-bg); color: var(--text-muted); box-shadow: none; }
  .module-card:disabled .module-card__status { color: var(--text-muted); background: var(--gray-bg); }
  .module-card:disabled .module-card__status::before { background: var(--text-muted); }

  .module-card__body { padding: 2px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .module-card h3 { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
  .module-card p { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; flex: 1; }
  .module-card__enter {
    margin-top: 10px; font-size: 11.5px; font-weight: 700; color: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 8px; border-radius: 8px; background: var(--accent-light);
    transition: background .18s ease, color .18s ease;
  }
  .module-card__enter span { display: inline-block; transition: transform .18s ease; }

  .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
  .empty-state strong { color: var(--text); }

  .loading { max-width: 1200px; margin: 0 auto; width: 100%; }
  .skeleton-card {
    height: 140px; border-radius: var(--radius); background: var(--card-bg); border: 1px solid var(--border);
    overflow: hidden; position: relative;
  }
  .skeleton-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(17,24,39,.05), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  footer {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 10px 20px; font-size: 10.5px; color: var(--text-muted);
    border-top: 1px solid var(--border); background: var(--card-bg);
  }
  footer .env-badge {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 999px; background: var(--gray-bg); border: 1px solid var(--border); color: var(--text-muted);
  }

  @media (max-width: 560px) {
    .session .who { display: none; }
    .page-head .inner { align-items: flex-start; }
    .brand-preview { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand-wrap" id="brand-wrap">
      <a class="brand" href="https://qubira.vercel.app/" target="_blank" rel="noopener noreferrer" title="Ir al sitio web de QUBIRA">
        <img src="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" alt="QUBIRA">
        <div>
          <strong>QUBIRA</strong>
          <span>Selección de módulo</span>
        </div>
        <svg class="brand__go" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
      <a class="brand-preview" id="brand-preview" href="https://qubira.vercel.app/" target="_blank" rel="noopener noreferrer" tabindex="-1">
        <span class="brand-preview__frame"><iframe id="brand-preview-iframe" title="Vista previa de qubira.vercel.app" loading="lazy"></iframe></span>
        <span class="brand-preview__caption">Ver el sitio web público →</span>
      </a>
    </div>
    <div class="session">
      <div class="who">
        <strong id="session-name">—</strong>
        <span id="session-role">—</span>
      </div>
      <div class="avatar" id="session-avatar">–</div>
      <button class="btn btn-outline-light" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>
  <div class="header-accent"></div>

  <div class="page-head">
    <div class="inner">
      <div>
        <span class="tag">Sesión verificada</span>
        <h1>Selecciona una plataforma</h1>
        <p>Solo se muestran los módulos para los que tu cuenta tiene autorización.</p>
      </div>
      <div class="stat">
        <strong id="stat-count">–</strong>
        <span>Disponibles</span>
      </div>
    </div>
  </div>

  <main>
    <div class="section-wrap hub-layout">
      <div class="agenda-panel">
        <div class="agenda-panel__head"><h2>Mi agenda</h2></div>
        <div class="agenda-panel__today" id="agenda-today">—</div>
        <div id="agenda-body"><p class="agenda-loading">Cargando agenda…</p></div>
      </div>
      <div id="modules-container" class="loading">
        <div class="modules">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>QUBIRA · Plataforma corporativa interna</span>
    <span class="env-badge" id="env-badge">—</span>
  </footer>

<script>
'use strict';

const QR_API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000'
  : 'https://api-qubira.onrender.com';

const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
document.getElementById('env-badge').textContent = IS_LOCAL ? 'Entorno de desarrollo' : 'Producción';

/* Cada panel es su propio dominio (proyectos de Vercel separados) —
   no hay rutas internas compartidas. COMERCIAL todavía no tiene sitio
   desplegado (QUBIRA_COMERCIAL está vacío), por eso no tiene target. */
const MODULE_TARGETS = {
  TI:       IS_LOCAL ? 'http://localhost:5511' : 'https://qubira-ti.vercel.app',
  ADG:      IS_LOCAL ? 'http://localhost:5512' : 'https://qubira-adg.vercel.app',
  RRHH:     IS_LOCAL ? 'http://localhost:5513' : 'https://qubira-rrhh.vercel.app',
  SOPORTE:  IS_LOCAL ? 'http://localhost:5514' : 'https://qubira-soporte.vercel.app',
  DST:      IS_LOCAL ? 'http://localhost:5516' : 'https://qubira-dst.vercel.app',
  COMERCIAL: IS_LOCAL ? 'http://localhost:5517' : 'https://qubira-comercial.vercel.app',
};

/* TI/ADG son SPA — el traspaso lo recibe app.js en cualquier ruta,
   incluida la raíz. RRHH/Soporte/DST/Comercial son un index.html estático
   con un login.html aparte que recibe el traspaso — mandarlo a la raíz
   haría que el gate de sesión de index.html lo descarte antes de leerlo. */
const MODULE_HANDOFF_PATH = { TI: '/', ADG: '/', RRHH: '/login.html', SOPORTE: '/login.html', DST: '/login.html', COMERCIAL: '/login.html' };

/* Íconos en línea (trazo simple, estilo Feather) en vez de las
   iniciales de dos letras — accent/accentLight/group solo cambian la
   presentación de la tarjeta (color, en qué sección aparece), nada
   funcional. */
const ICONS = {
  cpu: '<rect x="6" y="6" width="12" height="12" rx="1.5"></rect><rect x="9" y="9" width="6" height="6" rx="1"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z"></path><polyline points="8.5 12.5 11 15 16 9"></polyline>',
  users: '<circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"></path><circle cx="17" cy="8" r="2.4"></circle><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.8"></path>',
  headset: '<path d="M4 13a8 8 0 0 1 16 0"></path><rect x="2.5" y="13" width="4" height="7" rx="2"></rect><rect x="17.5" y="13" width="4" height="7" rx="2"></rect>',
  cart: '<circle cx="9" cy="20" r="1.3"></circle><circle cx="18" cy="20" r="1.3"></circle><path d="M2.5 3h2.3l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21.5 7H6"></path>',
  shield: '<path d="M12 3l7 3v6c0 5-3.5 8.5-7 9-3.5-.5-7-4-7-9V6l7-3z"></path>',
  megaphone: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>',
  scale: '<path d="M12 2v19"></path><path d="M5 22h14"></path><path d="M3 7l4-2 4 2"></path><path d="M13 7l4-2 4 2"></path><path d="M3 7l2 6a2.5 2.5 0 0 0 4 0l2-6"></path><path d="M13 7l2 6a2.5 2.5 0 0 0 4 0l2-6"></path>',
  barchart: '<line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>',
};

const MODULE_META = {
  TI:        { label: 'OTI',        desc: 'Proyectos técnicos, tecnologías y cronogramas.', icon: ICONS.cpu,       accent: '#1d4ed8', accentLight: '#dbeafe', group: 'ops' },
  ADG:       { label: 'ADG',        desc: 'Aprobación y administración de proyectos.',       icon: ICONS.clipboard, accent: '#6d28d9', accentLight: '#ede9fe', group: 'ops' },
  RRHH:      { label: 'RR. HH.',    desc: 'Personal, contratos, nómina y reclutamiento.',    icon: ICONS.users,     accent: '#047857', accentLight: '#d1fae5', group: 'ops' },
  SOPORTE:   { label: 'Soporte',    desc: 'Mesa de ayuda y soporte técnico.',                icon: ICONS.headset,   accent: '#b45309', accentLight: '#fef3c7', group: 'ops' },
  COMERCIAL: { label: 'Comercial',  desc: 'Catálogo de productos disponibles para venta o alquiler.', icon: ICONS.cart, accent: '#0f766e', accentLight: '#ecfdf5', group: 'ops' },
  DST:       { label: 'DST',        desc: 'Seguridad, accesos y auditoría del ecosistema.',  icon: ICONS.shield,    accent: '#b91c1c', accentLight: '#fee2e2', group: 'security' },
  ACM:       { label: 'Comunicación y Marketing', desc: 'Comunicación interna y externa, marca y campañas de marketing.', icon: ICONS.megaphone, accent: '#db2777', accentLight: '#fce7f3', group: 'ops' },
  DJ:        { label: 'Jurídico',   desc: 'Asesoría legal, contratos y cumplimiento normativo.', icon: ICONS.scale,    accent: '#374151', accentLight: '#f3f4f6', group: 'ops' },
  CG:        { label: 'Control de Gestión', desc: 'Indicadores, seguimiento y control de gestión corporativa.', icon: ICONS.barchart, accent: '#0e7490', accentLight: '#ecfeff', group: 'ops' },
};

const GROUP_ORDER = ['ops', 'security'];

function goToLogin() { window.location.href = 'login.html'; }

/* La vista previa del sitio público carga su iframe recién al primer
   hover/foco — así la pantalla de selección de módulo no paga el
   costo de cargar qubira.vercel.app si nadie pasa el mouse por ahí. */
(function setupBrandPreview() {
  const wrap = document.getElementById('brand-wrap');
  const iframe = document.getElementById('brand-preview-iframe');
  if (!wrap || !iframe) return;
  let loaded = false;
  function loadPreview() {
    if (loaded) return;
    loaded = true;
    iframe.src = 'https://qubira.vercel.app/';
  }
  wrap.addEventListener('mouseenter', loadPreview);
  wrap.addEventListener('focusin', loadPreview);
})();

function getToken() { return localStorage.getItem('qubira_token'); }

async function logout() {
  const token = getToken();
  try {
    if (token) await fetch(`${QR_API_BASE}/api/auth/logout`, { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
  } catch (_) { /* si ya estaba vencido igual cerramos local */ }
  localStorage.removeItem('qubira_token');
  localStorage.removeItem('qubira_user');
  goToLogin();
}
document.getElementById('logout-btn').addEventListener('click', logout);

function renderSession(user) {
  const nombre = `${user.nombre || ''} ${user.apellidos || ''}`.trim() || user.username;
  const iniciales = (user.nombre?.[0] || user.username?.[0] || '?').toUpperCase() + (user.apellidos?.[0] || '').toUpperCase();
  document.getElementById('session-name').textContent = nombre;
  document.getElementById('session-role').textContent = user.cargo ? `${user.cargo} · Qubira` : 'Qubira';
  document.getElementById('session-avatar').textContent = iniciales;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ─── Agenda del día (panel izquierdo) ─────────────────────────────────────
/* El calendario corporativo (calendar.meetings) es compartido por todos
   los paneles (TI/ADG/RRHH/Soporte) y /api/calendar solo exige sesión
   válida (no un módulo específico) — así que esta pantalla de selección
   puede mostrar la agenda de la persona sin necesidad de "entrar" a
   ningún panel primero. mine=true trae solo las reuniones donde el
   usuario logueado es participante interno. */
const WEEKDAY_LABELS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MONTH_LABELS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function isoDate(d) { return d.toISOString().slice(0, 10); }

function dayLabel(iso, todayIso, tomorrowIso) {
  if (iso === todayIso) return 'Hoy';
  if (iso === tomorrowIso) return 'Mañana';
  const d = new Date(iso + 'T00:00:00');
  return `${WEEKDAY_LABELS[d.getDay()]} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function agendaItemHtml(m) {
  const metaBits = [];
  if (m.meeting_type) metaBits.push(esc(m.meeting_type));
  if (m.location) metaBits.push(esc(m.location));
  return `
    <div class="agenda-item">
      <div class="agenda-item__time">${m.start_time.slice(0,5)}</div>
      <div>
        <div class="agenda-item__title">${esc(m.title)}</div>
        ${metaBits.length ? `<div class="agenda-item__meta">${metaBits.join(' · ')}</div>` : ''}
      </div>
    </div>`;
}

async function loadAgenda() {
  const body = document.getElementById('agenda-body');
  const today = new Date();
  const todayIso = isoDate(today);
  document.getElementById('agenda-today').textContent =
    `${WEEKDAY_LABELS[today.getDay()]} ${today.getDate()} de ${MONTH_LABELS[today.getMonth()]}`;

  const to = new Date(today);
  to.setDate(to.getDate() + 6);
  const tomorrowIso = isoDate(new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1));

  try {
    const token = getToken();
    const qs = new URLSearchParams({ mine: 'true', date_from: todayIso, date_to: isoDate(to) });
    const res = await fetch(`${QR_API_BASE}/api/calendar/meetings?${qs}`, { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) throw new Error('No se pudo cargar la agenda');
    const meetings = (await res.json()).filter(m => m.status !== 'cancelled');

    if (!meetings.length) {
      body.innerHTML = '<p class="agenda-empty">No tienes reuniones programadas en los próximos días.</p>';
      return;
    }

    const groups = {};
    meetings.forEach(m => { (groups[m.meeting_date] ||= []).push(m); });
    const dates = Object.keys(groups).sort();

    body.innerHTML = dates.map(iso => `
      <div class="agenda-day">
        <div class="agenda-day__label">${dayLabel(iso, todayIso, tomorrowIso)}</div>
        ${groups[iso].sort((a, b) => a.start_time.localeCompare(b.start_time)).map(agendaItemHtml).join('')}
      </div>`).join('');
  } catch (err) {
    body.innerHTML = '<p class="agenda-error">No se pudo cargar tu agenda.</p>';
  }
}

function moduleCardHtml(mod) {
  const meta = MODULE_META[mod] || { label: mod, desc: '', icon: ICONS.cpu, accent: '#4f46e5', accentLight: '#eef2ff' };
  const hasTarget = !!MODULE_TARGETS[mod];
  return `
  <button type="button" class="module-card" data-module="${mod}" ${hasTarget ? '' : 'disabled'}
    style="--accent:${meta.accent};--accent-light:${meta.accentLight}">
    <div class="module-card__banner">
      <div class="module-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${meta.icon}</svg>
      </div>
      <div class="module-card__status">${hasTarget ? 'Disponible' : 'Próximamente'}</div>
    </div>
    <div class="module-card__body">
      <h3>${meta.label}</h3>
      <p>${meta.desc}</p>
      ${hasTarget ? '<span class="module-card__enter">Entrar <span>→</span></span>' : ''}
    </div>
  </button>`;
}

function renderModules(authorizedModules) {
  const container = document.getElementById('modules-container');
  /* "Disponibles" cuenta solo los que de verdad se pueden abrir (tienen
     target desplegado) — antes contaba también los "Próximamente"
     autorizados, lo que no cuadraba con lo que se veía en pantalla. */
  const availableCount = authorizedModules.filter(m => !!MODULE_TARGETS[m]).length;
  document.getElementById('stat-count').textContent = availableCount;

  if (!authorizedModules.length) {
    container.className = 'empty-state';
    container.innerHTML = '<strong>No tienes módulos autorizados todavía.</strong><p style="margin-top:8px">Contacta a un administrador para que te asigne un área.</p>';
    return;
  }

  /* Un solo grid con todos los módulos: primero los disponibles
     (ordenados por grupo: áreas operativas, luego seguridad), los
     "Próximamente" siempre al final — antes se intercalaban con los
     disponibles sin ningún criterio. */
  const ordered = [...authorizedModules].sort((a, b) => {
    const availA = MODULE_TARGETS[a] ? 0 : 1;
    const availB = MODULE_TARGETS[b] ? 0 : 1;
    if (availA !== availB) return availA - availB;
    const ga = GROUP_ORDER.indexOf(MODULE_META[a]?.group || 'ops');
    const gb = GROUP_ORDER.indexOf(MODULE_META[b]?.group || 'ops');
    return ga - gb;
  });

  container.className = 'section-wrap';
  container.innerHTML = `<div class="modules">${ordered.map(moduleCardHtml).join('')}</div>`;

  container.querySelectorAll('.module-card').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => enterModule(btn.dataset.module));
  });
}

async function enterModule(mod) {
  const target = MODULE_TARGETS[mod];
  if (!target) return;
  const token = getToken();
  try {
    const res = await fetch(`${QR_API_BASE}/api/auth/handoff`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token },
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert(data.error || 'No se pudo abrir el módulo. Intenta de nuevo.');
      return;
    }
    const path = MODULE_HANDOFF_PATH[mod] || '/';
    window.location.href = `${target}${path}?handoff=${encodeURIComponent(data.code)}`;
  } catch (err) {
    alert('No se pudo conectar con el servidor.');
  }
}

/* true si la sesión seguía siendo válida (y ya renderizó todo), false
   si no — usado tanto por la carga inicial como por el heartbeat. Si
   otro dispositivo reemplazó la sesión, redirige a la alerta con el
   IP de ese nuevo inicio de sesión en vez de mandar a login sin más. */
async function checkMe(token) {
  const res = await fetch(`${QR_API_BASE}/api/auth/me`, { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) {
    const data401 = await res.json().catch(() => ({}));
    const cachedUsername = JSON.parse(localStorage.getItem('qubira_user') || 'null')?.username;
    localStorage.removeItem('qubira_token');
    localStorage.removeItem('qubira_user');
    if (data401?.code === 'SESSION_REPLACED') {
      window.location.href = `session-alert.html?username=${encodeURIComponent(cachedUsername || '')}&ip=${encodeURIComponent(data401.ip || '')}`;
    } else {
      goToLogin();
    }
    return false;
  }
  const data = await res.json();
  localStorage.setItem('qubira_user', JSON.stringify(data.user));
  renderSession(data.user);
  renderModules(data.user.authorized_modules || []);
  return true;
}

(async function init() {
  const token = getToken();
  if (!token) { goToLogin(); return; }

  loadAgenda();

  try {
    await checkMe(token);
  } catch (err) {
    document.getElementById('modules-container').className = 'empty-state';
    document.getElementById('modules-container').innerHTML = '<strong>No se pudo conectar con la API.</strong>';
  }
})();

// ─── Cierre de sesión por inactividad + detección de sesión reemplazada ──────
/* Basado en Date.now() y un solo "tick" cada 1s (no en cadenas de
   setTimeout) para que funcione igual aunque el navegador retrase los
   timers de una pestaña en segundo plano — al volver a mirarla (o en
   el próximo tick, atrasado o no) el cálculo de tiempo real transcurrido
   sigue siendo correcto. Además hace un "heartbeat" periódico contra el
   servidor: si esta cuenta inició sesión en otro dispositivo, el
   servidor invalida esta sesión y lo detecta acá aunque no haya pasado
   ninguna inactividad, mostrando un aviso en vez de un cierre mudo. */
(function setupSessionGuard(onLogout) {
  const WARN_AFTER_MS = 90 * 1000;
  const LOGOUT_AFTER_MS = 120 * 1000;
  const HEARTBEAT_MS = 20 * 1000;

  let lastActivity = Date.now();
  let overlay = null;
  let countdownInterval = null;
  let lastHeartbeatAt = 0;

  function hideWarning() {
    if (overlay) { overlay.remove(); overlay = null; }
    clearInterval(countdownInterval);
  }

  function showWarning() {
    if (overlay) return;
    let secondsLeft = Math.round((LOGOUT_AFTER_MS - WARN_AFTER_MS) / 1000);
    overlay = document.createElement('div');
    overlay.id = 'inactivity-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:inherit';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:16px;padding:28px;max-width:340px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25)">
        <div style="width:48px;height:48px;border-radius:50%;background:#fef3c7;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px">⏱</div>
        <h3 style="font-size:16px;font-weight:800;margin:0 0 8px;color:#111827">¿Sigues ahí?</h3>
        <p style="font-size:13px;color:#6b7280;margin:0 0 18px;line-height:1.5">Tu sesión se cerrará por inactividad en <strong id="inactivity-countdown">${secondsLeft}</strong> segundos.</p>
        <button id="inactivity-stay-btn" style="width:100%;padding:12px;border:none;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit">Seguir conectado</button>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('inactivity-stay-btn').addEventListener('click', () => { lastActivity = Date.now(); hideWarning(); });
    countdownInterval = setInterval(() => {
      secondsLeft -= 1;
      const el = document.getElementById('inactivity-countdown');
      if (el) el.textContent = String(Math.max(secondsLeft, 0));
      if (secondsLeft <= 0) clearInterval(countdownInterval);
    }, 1000);
  }

  function handleActivity() {
    lastActivity = Date.now();
    hideWarning();
  }
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt =>
    document.addEventListener(evt, handleActivity, { passive: true }));

  /* checkMe ya sabe distinguir "sesión reemplazada" (redirige a la
     alerta con el IP del nuevo dispositivo) de un 401 normal (manda al
     login) — este heartbeat solo dispara la llamada para que ese
     chequeo ocurra. */
  async function heartbeat() {
    const token = localStorage.getItem('qubira_token');
    if (!token) return;
    try { await checkMe(token); } catch (_) { /* sin red — se reintenta en el próximo tick */ }
  }

  function tick() {
    if (!localStorage.getItem('qubira_token')) return;
    const elapsed = Date.now() - lastActivity;
    if (elapsed >= LOGOUT_AFTER_MS) { hideWarning(); onLogout(); return; }
    if (elapsed >= WARN_AFTER_MS) showWarning();

    const now = Date.now();
    if (now - lastHeartbeatAt >= HEARTBEAT_MS) { lastHeartbeatAt = now; heartbeat(); }
  }

  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  tick();
})(logout);
</script>
