<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUBIRA | Selección de módulo</title>
<link rel="icon" href="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #0b1120;
    --sidebar-bg-2: #151f38;
    --primary: #4f46e5;
    --primary-2: #818cf8;
    --primary-dark: #4338ca;
    --primary-light: #eef2ff;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
    --success: #059669;
    --danger: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 10px 25px -5px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
    --shadow-lg: 0 20px 40px -12px rgba(17,24,39,.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; min-height: 100dvh; }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px clamp(20px, 4vw, 48px);
    background: linear-gradient(120deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
    color: #fff;
    border-bottom: 1px solid rgba(129,140,248,.18);
    position: relative; z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .brand img { width: 40px; height: 40px; object-fit: contain; border-radius: 11px; background: rgba(255,255,255,.08); padding: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .brand strong { font-size: 17px; letter-spacing: .1em; font-weight: 800; }
  .brand span { display: block; font-size: 10px; color: var(--primary-2); text-transform: uppercase; letter-spacing: .16em; font-weight: 700; }

  .session { display: flex; align-items: center; gap: 16px; }
  .session .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary-2), var(--primary));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(255,255,255,.14);
  }
  .session .who { display: flex; flex-direction: column; gap: 2px; text-align: right; }
  .session .who strong { font-size: 13px; font-weight: 700; }
  .session .who span { font-size: 10.5px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .logout-btn {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); color: #fff;
    padding: 9px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: .2s ease;
  }
  .logout-btn:hover { background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.45); }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 55%, var(--bg) 100%);
    padding: clamp(40px, 7vh, 72px) 20px clamp(64px, 9vh, 96px);
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(560px 280px at 18% 0%, rgba(129,140,248,.25), transparent 60%),
      radial-gradient(480px 260px at 85% 10%, rgba(79,70,229,.22), transparent 60%);
    pointer-events: none;
  }
  .intro { position: relative; text-align: center; max-width: 620px; margin: 0 auto; }
  .intro .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 15px; border-radius: 999px;
    background: rgba(129,140,248,.16); color: #c7d2fe; font-size: 11.5px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 18px;
    border: 1px solid rgba(129,140,248,.28);
  }
  .intro .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.25); }
  .intro h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; letter-spacing: -.02em; margin-bottom: 10px; color: #fff; }
  .intro p { color: rgba(255,255,255,.62); font-size: 14.5px; line-height: 1.6; }

  /* ---------- Modules grid ---------- */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 20px 64px; margin-top: clamp(-52px, -6vh, -40px); position: relative; z-index: 1; }
  .modules {
    width: 100%; max-width: 1000px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); gap: 20px;
  }
  .module-card {
    --accent: var(--primary);
    --accent-light: var(--primary-light);
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
    padding: 26px 22px 22px; box-shadow: var(--shadow-lg); text-align: left; cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display: flex; flex-direction: column; gap: 12px; font: inherit; color: inherit;
    position: relative; overflow: hidden;
  }
  .module-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--accent); transform: scaleX(0); transform-origin: left;
    transition: transform .2s ease;
  }
  .module-card:not(:disabled):hover { transform: translateY(-4px); box-shadow: 0 24px 44px -14px rgba(17,24,39,.22); border-color: transparent; }
  .module-card:not(:disabled):hover::before { transform: scaleX(1); }
  .module-card:disabled { cursor: not-allowed; opacity: .5; box-shadow: var(--shadow); }

  .module-card__top { display: flex; align-items: flex-start; justify-content: space-between; }
  .module-icon {
    width: 48px; height: 48px; border-radius: 13px;
    background: var(--accent-light); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800;
    letter-spacing: -.01em;
  }
  .module-card__arrow {
    width: 30px; height: 30px; border-radius: 50%; background: var(--bg); color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    opacity: 0; transform: translateX(-4px); transition: .18s ease;
  }
  .module-card:not(:disabled):hover .module-card__arrow { opacity: 1; transform: translateX(0); background: var(--accent); color: #fff; }

  .module-card h3 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .module-card p { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; }
  .module-card .soon {
    align-self: flex-start; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); background: var(--bg); padding: 4px 9px; border-radius: 999px;
  }

  .empty-state, .loading { text-align: center; color: rgba(255,255,255,.7); padding: 40px 20px; position: relative; }
  .loading { color: rgba(255,255,255,.55); font-size: 13.5px; }
  .empty-state strong { color: #fff; }

  footer {
    text-align: center; padding: 18px 20px 26px; font-size: 11px; color: var(--text-muted);
    letter-spacing: .03em;
  }

  @media (max-width: 560px) {
    .session .who { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" alt="QUBIRA">
      <div>
        <strong>QUBIRA</strong>
        <span>Selección de módulo</span>
      </div>
    </div>
    <div class="session">
      <div class="who">
        <strong id="session-name">—</strong>
        <span id="session-role">—</span>
      </div>
      <div class="avatar" id="session-avatar">–</div>
      <button class="logout-btn" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <div class="hero">
    <div class="intro">
      <div class="eyebrow">Sesión verificada</div>
      <h1>Selecciona una plataforma</h1>
      <p>Solo se muestran los módulos para los que tu cuenta tiene autorización.</p>
    </div>
  </div>

  <main>
    <div id="modules-container" class="loading">Cargando módulos autorizados…</div>
  </main>

  <footer>QUBIRA · Plataforma corporativa interna</footer>

<script>
'use strict';

const QR_API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000'
  : 'https://api-qubira.onrender.com';

const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

/* Cada panel es su propio dominio (proyectos de Vercel separados) —
   no hay rutas internas compartidas. COMERCIAL todavía no tiene sitio
   desplegado (QUBIRA_COMERCIAL está vacío), por eso no tiene target. */
const MODULE_TARGETS = {
  TI:       IS_LOCAL ? 'http://localhost:5511' : 'https://qubira-ti.vercel.app',
  ADG:      IS_LOCAL ? 'http://localhost:5512' : 'https://qubira-adg.vercel.app',
  RRHH:     IS_LOCAL ? 'http://localhost:5513' : 'https://qubira-rrhh.vercel.app',
  SOPORTE:  IS_LOCAL ? 'http://localhost:5514' : 'https://qubira-soporte.vercel.app',
  DST:      IS_LOCAL ? 'http://localhost:5516' : 'https://qubira-dst.vercel.app',
};

/* TI/ADG son SPA — el traspaso lo recibe app.js en cualquier ruta,
   incluida la raíz. RRHH/Soporte/DST son un index.html estático con un
   login.html aparte que recibe el traspaso — mandarlo a la raíz haría
   que el gate de sesión de index.html lo descarte antes de leerlo. */
const MODULE_HANDOFF_PATH = { TI: '/', ADG: '/', RRHH: '/login.html', SOPORTE: '/login.html', DST: '/login.html' };

/* accent/accentLight solo cambian el color de acento de cada tarjeta
   (borde superior, ícono, flecha) — nada funcional. */
const MODULE_META = {
  TI:        { label: 'TI',         desc: 'Proyectos técnicos, tecnologías y cronogramas.', letter: 'TI', accent: '#2563eb', accentLight: '#dbeafe' },
  ADG:       { label: 'ADG',        desc: 'Aprobación y administración de proyectos.',       letter: 'AD', accent: '#7c3aed', accentLight: '#ede9fe' },
  RRHH:      { label: 'RR. HH.',    desc: 'Personal, contratos, nómina y reclutamiento.',    letter: 'RH', accent: '#059669', accentLight: '#d1fae5' },
  SOPORTE:   { label: 'Soporte',    desc: 'Mesa de ayuda y soporte técnico.',                letter: 'SO', accent: '#d97706', accentLight: '#fef3c7' },
  COMERCIAL: { label: 'Comercial',  desc: 'Próximamente.',                                    letter: 'CO', accent: '#6b7280', accentLight: '#f3f4f6' },
  DST:       { label: 'DST',        desc: 'Seguridad, accesos y auditoría del ecosistema.',  letter: 'DS', accent: '#dc2626', accentLight: '#fee2e2' },
};

function goToLogin() { window.location.href = 'login.html'; }

function getToken() { return localStorage.getItem('qubira_token'); }

async function logout() {
  const token = getToken();
  try {
    if (token) await fetch(`${QR_API_BASE}/api/auth/logout`, { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
  } catch (_) { /* si ya estaba vencido igual cerramos local */ }
  localStorage.removeItem('qubira_token');
  localStorage.removeItem('qubira_user');
  goToLogin();
}
document.getElementById('logout-btn').addEventListener('click', logout);

function renderSession(user) {
  const nombre = `${user.nombre || ''} ${user.apellidos || ''}`.trim() || user.username;
  const iniciales = (user.nombre?.[0] || user.username?.[0] || '?').toUpperCase() + (user.apellidos?.[0] || '').toUpperCase();
  document.getElementById('session-name').textContent = nombre;
  document.getElementById('session-role').textContent = user.cargo ? `${user.cargo} · Qubira` : 'Qubira';
  document.getElementById('session-avatar').textContent = iniciales;
}

function renderModules(authorizedModules) {
  const container = document.getElementById('modules-container');
  if (!authorizedModules.length) {
    container.className = 'empty-state';
    container.innerHTML = '<strong>No tienes módulos autorizados todavía.</strong><p style="margin-top:8px">Contacta a un administrador para que te asigne un área.</p>';
    return;
  }
  container.className = 'modules';
  container.innerHTML = authorizedModules.map(mod => {
    const meta = MODULE_META[mod] || { label: mod, desc: '', letter: mod.slice(0, 2), accent: '#4f46e5', accentLight: '#eef2ff' };
    const hasTarget = !!MODULE_TARGETS[mod];
    return `
    <button type="button" class="module-card" data-module="${mod}" ${hasTarget ? '' : 'disabled'}
      style="--accent:${meta.accent};--accent-light:${meta.accentLight}">
      <div class="module-card__top">
        <div class="module-icon">${meta.letter}</div>
        ${hasTarget ? '<div class="module-card__arrow">→</div>' : ''}
      </div>
      <h3>${meta.label}</h3>
      <p>${meta.desc}</p>
      ${hasTarget ? '' : '<span class="soon">Próximamente</span>'}
    </button>`;
  }).join('');

  container.querySelectorAll('.module-card').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => enterModule(btn.dataset.module));
  });
}

async function enterModule(mod) {
  const target = MODULE_TARGETS[mod];
  if (!target) return;
  const token = getToken();
  try {
    const res = await fetch(`${QR_API_BASE}/api/auth/handoff`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token },
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert(data.error || 'No se pudo abrir el módulo. Intenta de nuevo.');
      return;
    }
    const path = MODULE_HANDOFF_PATH[mod] || '/';
    window.location.href = `${target}${path}?handoff=${encodeURIComponent(data.code)}`;
  } catch (err) {
    alert('No se pudo conectar con el servidor.');
  }
}

(async function init() {
  const token = getToken();
  if (!token) { goToLogin(); return; }

  try {
    const res = await fetch(`${QR_API_BASE}/api/auth/me`, { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { localStorage.removeItem('qubira_token'); localStorage.removeItem('qubira_user'); goToLogin(); return; }
    const data = await res.json();
    localStorage.setItem('qubira_user', JSON.stringify(data.user));
    renderSession(data.user);
    renderModules(data.user.authorized_modules || []);
  } catch (err) {
    document.getElementById('modules-container').className = 'empty-state';
    document.getElementById('modules-container').innerHTML = '<strong>No se pudo conectar con la API.</strong>';
  }
})();
</script>
</body>
</html>
