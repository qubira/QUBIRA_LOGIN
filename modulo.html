<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUBIRA | Selección de módulo</title>
<link rel="icon" href="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #111827;
    --primary: #4f46e5;
    --primary-2: #818cf8;
    --primary-dark: #4338ca;
    --primary-light: #eef2ff;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
    --success: #059669;
    --danger: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 10px 25px -5px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; min-height: 100dvh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px clamp(20px, 4vw, 48px);
    background: var(--sidebar-bg); color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 38px; height: 38px; object-fit: contain; border-radius: 10px; background: rgba(255,255,255,.1); padding: 6px; }
  .brand strong { font-size: 16px; letter-spacing: .08em; font-weight: 800; }
  .brand span { display: block; font-size: 10.5px; color: var(--primary-2); text-transform: uppercase; letter-spacing: .15em; }

  .session { display: flex; align-items: center; gap: 14px; }
  .session .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0;
  }
  .session .who { display: flex; flex-direction: column; gap: 2px; }
  .session .who strong { font-size: 13px; }
  .session .who span { font-size: 11px; color: rgba(255,255,255,.55); }
  .logout-btn {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #fff;
    padding: 8px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: .2s ease;
  }
  .logout-btn:hover { background: rgba(239,68,68,.16); border-color: rgba(239,68,68,.4); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: clamp(28px, 6vh, 64px) 20px; }
  .intro { text-align: center; max-width: 560px; margin-bottom: 36px; }
  .intro .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
    background: var(--primary-light); color: var(--primary-dark); font-size: 12px; font-weight: 700;
    letter-spacing: .04em; margin-bottom: 16px;
  }
  .intro h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
  .intro p { color: var(--text-muted); font-size: 14px; line-height: 1.6; }

  .modules {
    width: 100%; max-width: 960px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;
  }
  .module-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
    padding: 24px 22px; box-shadow: var(--shadow); text-align: left; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease; display: flex; flex-direction: column; gap: 10px;
    font: inherit; color: inherit;
  }
  .module-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .module-card:disabled { cursor: not-allowed; opacity: .55; }
  .module-card:disabled:hover { transform: none; box-shadow: var(--shadow); }
  .module-icon {
    width: 46px; height: 46px; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark);
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;
  }
  .module-card h3 { font-size: 17px; font-weight: 800; }
  .module-card p { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
  .module-card .soon { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }

  .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; }
  .loading { text-align: center; color: var(--text-muted); padding: 40px; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" alt="QUBIRA">
      <div>
        <strong>QUBIRA</strong>
        <span>Selección de módulo</span>
      </div>
    </div>
    <div class="session">
      <div class="who">
        <strong id="session-name">—</strong>
        <span id="session-role">—</span>
      </div>
      <div class="avatar" id="session-avatar">–</div>
      <button class="logout-btn" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <div class="intro">
      <div class="eyebrow">Bienvenido de nuevo</div>
      <h1>Selecciona una plataforma</h1>
      <p>Solo se muestran los módulos para los que tu cuenta tiene autorización.</p>
    </div>
    <div id="modules-container" class="loading">Cargando módulos autorizados…</div>
  </main>

<script>
'use strict';

const QR_API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000'
  : 'https://api-qubira.onrender.com';

const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

/* Cada panel es su propio dominio (proyectos de Vercel separados) —
   no hay rutas internas compartidas. COMERCIAL todavía no tiene sitio
   desplegado (QUBIRA_COMERCIAL está vacío), por eso no tiene target. */
const MODULE_TARGETS = {
  TI:       IS_LOCAL ? 'http://localhost:5511' : 'https://qubira-ti.vercel.app',
  ADG:      IS_LOCAL ? 'http://localhost:5512' : 'https://qubira-adg.vercel.app',
  RRHH:     IS_LOCAL ? 'http://localhost:5513' : 'https://qubira-rrhh.vercel.app',
  SOPORTE:  IS_LOCAL ? 'http://localhost:5514' : 'https://qubira-soporte.vercel.app',
};

const MODULE_META = {
  TI:        { label: 'TI',         desc: 'Proyectos técnicos, tecnologías y cronogramas.', letter: 'TI' },
  ADG:       { label: 'ADG',        desc: 'Aprobación y administración de proyectos.',       letter: 'AD' },
  RRHH:      { label: 'RR. HH.',    desc: 'Personal, contratos, nómina y reclutamiento.',    letter: 'RH' },
  SOPORTE:   { label: 'Soporte',    desc: 'Mesa de ayuda y soporte técnico.',                letter: 'SO' },
  COMERCIAL: { label: 'Comercial',  desc: 'Próximamente.',                                    letter: 'CO' },
};

function goToLogin() { window.location.href = 'login.html'; }

function getToken() { return localStorage.getItem('qubira_token'); }

async function logout() {
  const token = getToken();
  try {
    if (token) await fetch(`${QR_API_BASE}/api/auth/logout`, { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
  } catch (_) { /* si ya estaba vencido igual cerramos local */ }
  localStorage.removeItem('qubira_token');
  localStorage.removeItem('qubira_user');
  goToLogin();
}
document.getElementById('logout-btn').addEventListener('click', logout);

function renderSession(user) {
  const nombre = `${user.nombre || ''} ${user.apellidos || ''}`.trim() || user.username;
  const iniciales = (user.nombre?.[0] || user.username?.[0] || '?').toUpperCase() + (user.apellidos?.[0] || '').toUpperCase();
  document.getElementById('session-name').textContent = nombre;
  document.getElementById('session-role').textContent = user.cargo ? `${user.cargo} · Qubira` : 'Qubira';
  document.getElementById('session-avatar').textContent = iniciales;
}

function renderModules(authorizedModules) {
  const container = document.getElementById('modules-container');
  if (!authorizedModules.length) {
    container.className = 'empty-state';
    container.innerHTML = '<strong>No tienes módulos autorizados todavía.</strong><p style="margin-top:8px">Contacta a un administrador para que te asigne un área.</p>';
    return;
  }
  container.className = 'modules';
  container.innerHTML = authorizedModules.map(mod => {
    const meta = MODULE_META[mod] || { label: mod, desc: '', letter: mod.slice(0, 2) };
    const hasTarget = !!MODULE_TARGETS[mod];
    return `
    <button type="button" class="module-card" data-module="${mod}" ${hasTarget ? '' : 'disabled'}>
      <div class="module-icon">${meta.letter}</div>
      <h3>${meta.label}</h3>
      <p>${meta.desc}</p>
      ${hasTarget ? '' : '<span class="soon">Próximamente</span>'}
    </button>`;
  }).join('');

  container.querySelectorAll('.module-card').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => enterModule(btn.dataset.module));
  });
}

async function enterModule(mod) {
  const target = MODULE_TARGETS[mod];
  if (!target) return;
  const token = getToken();
  try {
    const res = await fetch(`${QR_API_BASE}/api/auth/handoff`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token },
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert(data.error || 'No se pudo abrir el módulo. Intenta de nuevo.');
      return;
    }
    window.location.href = `${target}/?handoff=${encodeURIComponent(data.code)}`;
  } catch (err) {
    alert('No se pudo conectar con el servidor.');
  }
}

(async function init() {
  const token = getToken();
  if (!token) { goToLogin(); return; }

  try {
    const res = await fetch(`${QR_API_BASE}/api/auth/me`, { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { localStorage.removeItem('qubira_token'); localStorage.removeItem('qubira_user'); goToLogin(); return; }
    const data = await res.json();
    localStorage.setItem('qubira_user', JSON.stringify(data.user));
    renderSession(data.user);
    renderModules(data.user.authorized_modules || []);
  } catch (err) {
    document.getElementById('modules-container').className = 'empty-state';
    document.getElementById('modules-container').innerHTML = '<strong>No se pudo conectar con la API.</strong>';
  }
})();
</script>
</body>
</html>
