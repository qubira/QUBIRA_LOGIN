<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUBIRA | Selección de módulo</title>
<link rel="icon" href="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #111827;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --primary-light: #eef2ff;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --border: #e2e4e9;
    --text: #111827;
    --text-muted: #6b7280;
    --gray-bg: #f3f4f6;
    --danger: #dc2626;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(17,24,39,.05);
    --shadow-hover: 0 8px 18px rgba(17,24,39,.09);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; min-height: 100dvh; }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(20px, 4vw, 44px);
    background: var(--sidebar-bg); color: #fff;
  }
  header::after { content: none; }
  .header-accent { height: 3px; background: linear-gradient(90deg, var(--primary), #818cf8 45%, var(--primary)); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 34px; height: 34px; object-fit: contain; border-radius: 8px; background: rgba(255,255,255,.08); padding: 5px; }
  .brand strong { font-size: 15px; letter-spacing: .04em; font-weight: 700; }
  .brand span { display: block; font-size: 10px; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; margin-top: 1px; }

  .session { display: flex; align-items: center; gap: 14px; }
  .session .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.15);
  }
  .session .who { display: flex; flex-direction: column; gap: 1px; text-align: right; }
  .session .who strong { font-size: 12.5px; font-weight: 600; }
  .session .who span { font-size: 10.5px; color: rgba(255,255,255,.45); }

  /* ---------- Buttons (mismo sistema que el resto de los paneles) ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 15px; border-radius: var(--radius-sm);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; transition: background .15s, border-color .15s, color .15s;
    font-family: inherit; white-space: nowrap;
  }
  .btn-outline-light { background: transparent; color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.22); }
  .btn-outline-light:hover { background: rgba(220,38,38,.14); border-color: rgba(220,38,38,.4); color: #fca5a5; }

  /* ---------- Page header ---------- */
  .page-head {
    background: var(--card-bg); border-bottom: 1px solid var(--border);
    padding: clamp(28px, 4.5vh, 42px) 20px;
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 16px 16px;
    background-position: -8px -8px;
  }
  .page-head .inner {
    max-width: 1080px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .page-head .tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--primary-dark); background: var(--primary-light); border: 1px solid #c7d2fe;
    padding: 5px 11px; border-radius: 999px; margin-bottom: 14px;
  }
  .page-head .tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--success, #059669); }
  .page-head h1 { font-size: 25px; font-weight: 800; letter-spacing: -.015em; margin-bottom: 5px; }
  .page-head p { color: var(--text-muted); font-size: 13.5px; max-width: 480px; }
  .page-head .stat {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 20px; text-align: center; box-shadow: var(--shadow); flex-shrink: 0;
  }
  .page-head .stat strong { display: block; font-size: 24px; font-weight: 800; color: var(--primary); line-height: 1; }
  .page-head .stat span { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

  /* ---------- Sections ---------- */
  main { flex: 1; padding: clamp(30px, 4vh, 44px) 20px 60px; }
  .section-wrap { max-width: 1080px; margin: 0 auto; }
  .section-block + .section-block { margin-top: 34px; }
  .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .section-title h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); }
  .section-title .line { flex: 1; height: 1px; background: var(--border); }

  .modules {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 300px)); gap: 16px;
    align-items: stretch;
  }
  .module-card {
    --accent: var(--primary);
    --accent-light: var(--primary-light);
    display: flex; flex-direction: column; overflow: hidden; height: 100%;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); text-align: left; cursor: pointer;
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
    font: inherit; color: inherit;
  }
  .module-card:not(:disabled):hover { box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); transform: translateY(-3px); }
  .module-card:not(:disabled):hover .module-icon { transform: scale(1.06); }
  .module-card:not(:disabled):hover .module-card__enter span { transform: translateX(3px); }
  .module-card:disabled { cursor: not-allowed; }
  .module-card:not(:disabled):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .module-card__banner {
    background: var(--accent-light); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .module-icon {
    width: 40px; height: 40px; border-radius: 10px; background: var(--card-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(17,24,39,.05); transition: transform .18s ease;
  }
  .module-icon svg { width: 20px; height: 20px; }
  .module-card__status {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent);
    display: flex; align-items: center; gap: 5px;
  }
  .module-card__status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .module-card:disabled .module-card__banner { background: var(--gray-bg); }
  .module-card:disabled .module-icon { color: var(--text-muted); }
  .module-card:disabled .module-card__status { color: var(--text-muted); }
  .module-card:disabled .module-card__status::before { background: var(--text-muted); }

  .module-card__body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .module-card h3 { font-size: 15.5px; font-weight: 700; }
  .module-card p { font-size: 12px; color: var(--text-muted); line-height: 1.55; flex: 1; }
  .module-card__enter {
    margin-top: 4px; font-size: 11.5px; font-weight: 700; color: var(--accent);
    display: flex; align-items: center; gap: 5px;
  }
  .module-card__enter span { display: inline-block; transition: transform .18s ease; }

  .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; max-width: 1080px; margin: 0 auto; }
  .empty-state strong { color: var(--text); }

  .loading { max-width: 1080px; margin: 0 auto; }
  .skeleton-card {
    height: 168px; border-radius: var(--radius); background: var(--card-bg); border: 1px solid var(--border);
    overflow: hidden; position: relative;
  }
  .skeleton-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(17,24,39,.05), transparent);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  footer {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 20px 22px; font-size: 11px; color: var(--text-muted);
    border-top: 1px solid var(--border); background: var(--card-bg);
  }
  footer .env-badge {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 999px; background: var(--gray-bg); border: 1px solid var(--border); color: var(--text-muted);
  }

  @media (max-width: 560px) {
    .session .who { display: none; }
    .page-head .inner { align-items: flex-start; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" alt="QUBIRA">
      <div>
        <strong>QUBIRA</strong>
        <span>Selección de módulo</span>
      </div>
    </div>
    <div class="session">
      <div class="who">
        <strong id="session-name">—</strong>
        <span id="session-role">—</span>
      </div>
      <div class="avatar" id="session-avatar">–</div>
      <button class="btn btn-outline-light" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>
  <div class="header-accent"></div>

  <div class="page-head">
    <div class="inner">
      <div>
        <span class="tag">Sesión verificada</span>
        <h1>Selecciona una plataforma</h1>
        <p>Solo se muestran los módulos para los que tu cuenta tiene autorización.</p>
      </div>
      <div class="stat">
        <strong id="stat-count">–</strong>
        <span>Disponibles</span>
      </div>
    </div>
  </div>

  <main>
    <div id="modules-container" class="loading">
      <div class="modules">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <footer>
    <span>QUBIRA · Plataforma corporativa interna</span>
    <span class="env-badge" id="env-badge">—</span>
  </footer>

<script>
'use strict';

const QR_API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000'
  : 'https://api-qubira.onrender.com';

const IS_LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
document.getElementById('env-badge').textContent = IS_LOCAL ? 'Entorno de desarrollo' : 'Producción';

/* Cada panel es su propio dominio (proyectos de Vercel separados) —
   no hay rutas internas compartidas. COMERCIAL todavía no tiene sitio
   desplegado (QUBIRA_COMERCIAL está vacío), por eso no tiene target. */
const MODULE_TARGETS = {
  TI:       IS_LOCAL ? 'http://localhost:5511' : 'https://qubira-ti.vercel.app',
  ADG:      IS_LOCAL ? 'http://localhost:5512' : 'https://qubira-adg.vercel.app',
  RRHH:     IS_LOCAL ? 'http://localhost:5513' : 'https://qubira-rrhh.vercel.app',
  SOPORTE:  IS_LOCAL ? 'http://localhost:5514' : 'https://qubira-soporte.vercel.app',
  DST:      IS_LOCAL ? 'http://localhost:5516' : 'https://qubira-dst.vercel.app',
};

/* TI/ADG son SPA — el traspaso lo recibe app.js en cualquier ruta,
   incluida la raíz. RRHH/Soporte/DST son un index.html estático con un
   login.html aparte que recibe el traspaso — mandarlo a la raíz haría
   que el gate de sesión de index.html lo descarte antes de leerlo. */
const MODULE_HANDOFF_PATH = { TI: '/', ADG: '/', RRHH: '/login.html', SOPORTE: '/login.html', DST: '/login.html' };

/* Íconos en línea (trazo simple, estilo Feather) en vez de las
   iniciales de dos letras — accent/accentLight/group solo cambian la
   presentación de la tarjeta (color, en qué sección aparece), nada
   funcional. */
const ICONS = {
  cpu: '<rect x="6" y="6" width="12" height="12" rx="1.5"></rect><rect x="9" y="9" width="6" height="6" rx="1"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z"></path><polyline points="8.5 12.5 11 15 16 9"></polyline>',
  users: '<circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.5 2.5-6 6-6s6 2.5 6 6"></path><circle cx="17" cy="8" r="2.4"></circle><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.8"></path>',
  headset: '<path d="M4 13a8 8 0 0 1 16 0"></path><rect x="2.5" y="13" width="4" height="7" rx="2"></rect><rect x="17.5" y="13" width="4" height="7" rx="2"></rect>',
  cart: '<circle cx="9" cy="20" r="1.3"></circle><circle cx="18" cy="20" r="1.3"></circle><path d="M2.5 3h2.3l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21.5 7H6"></path>',
  shield: '<path d="M12 3l7 3v6c0 5-3.5 8.5-7 9-3.5-.5-7-4-7-9V6l7-3z"></path>',
};

const MODULE_META = {
  TI:        { label: 'TI',         desc: 'Proyectos técnicos, tecnologías y cronogramas.', icon: ICONS.cpu,       accent: '#1d4ed8', accentLight: '#dbeafe', group: 'ops' },
  ADG:       { label: 'ADG',        desc: 'Aprobación y administración de proyectos.',       icon: ICONS.clipboard, accent: '#6d28d9', accentLight: '#ede9fe', group: 'ops' },
  RRHH:      { label: 'RR. HH.',    desc: 'Personal, contratos, nómina y reclutamiento.',    icon: ICONS.users,     accent: '#047857', accentLight: '#d1fae5', group: 'ops' },
  SOPORTE:   { label: 'Soporte',    desc: 'Mesa de ayuda y soporte técnico.',                icon: ICONS.headset,   accent: '#b45309', accentLight: '#fef3c7', group: 'ops' },
  COMERCIAL: { label: 'Comercial',  desc: 'Próximamente.',                                    icon: ICONS.cart,      accent: '#6b7280', accentLight: '#f3f4f6', group: 'ops' },
  DST:       { label: 'DST',        desc: 'Seguridad, accesos y auditoría del ecosistema.',  icon: ICONS.shield,    accent: '#b91c1c', accentLight: '#fee2e2', group: 'security' },
};

const GROUP_LABELS = { ops: 'Áreas operativas', security: 'Seguridad y accesos' };
const GROUP_ORDER = ['ops', 'security'];

function goToLogin() { window.location.href = 'login.html'; }

function getToken() { return localStorage.getItem('qubira_token'); }

async function logout() {
  const token = getToken();
  try {
    if (token) await fetch(`${QR_API_BASE}/api/auth/logout`, { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
  } catch (_) { /* si ya estaba vencido igual cerramos local */ }
  localStorage.removeItem('qubira_token');
  localStorage.removeItem('qubira_user');
  goToLogin();
}
document.getElementById('logout-btn').addEventListener('click', logout);

function renderSession(user) {
  const nombre = `${user.nombre || ''} ${user.apellidos || ''}`.trim() || user.username;
  const iniciales = (user.nombre?.[0] || user.username?.[0] || '?').toUpperCase() + (user.apellidos?.[0] || '').toUpperCase();
  document.getElementById('session-name').textContent = nombre;
  document.getElementById('session-role').textContent = user.cargo ? `${user.cargo} · Qubira` : 'Qubira';
  document.getElementById('session-avatar').textContent = iniciales;
}

function moduleCardHtml(mod) {
  const meta = MODULE_META[mod] || { label: mod, desc: '', icon: ICONS.cpu, accent: '#4f46e5', accentLight: '#eef2ff' };
  const hasTarget = !!MODULE_TARGETS[mod];
  return `
  <button type="button" class="module-card" data-module="${mod}" ${hasTarget ? '' : 'disabled'}
    style="--accent:${meta.accent};--accent-light:${meta.accentLight}">
    <div class="module-card__banner">
      <div class="module-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${meta.icon}</svg>
      </div>
      <div class="module-card__status">${hasTarget ? 'Disponible' : 'Próximamente'}</div>
    </div>
    <div class="module-card__body">
      <h3>${meta.label}</h3>
      <p>${meta.desc}</p>
      ${hasTarget ? '<span class="module-card__enter">Entrar <span>→</span></span>' : ''}
    </div>
  </button>`;
}

function renderModules(authorizedModules) {
  const container = document.getElementById('modules-container');
  document.getElementById('stat-count').textContent = authorizedModules.length;

  if (!authorizedModules.length) {
    container.className = 'empty-state';
    container.innerHTML = '<strong>No tienes módulos autorizados todavía.</strong><p style="margin-top:8px">Contacta a un administrador para que te asigne un área.</p>';
    return;
  }

  container.className = 'section-wrap';
  container.innerHTML = GROUP_ORDER.map(group => {
    const mods = authorizedModules.filter(mod => (MODULE_META[mod]?.group || 'ops') === group);
    if (!mods.length) return '';
    return `
    <div class="section-block">
      <div class="section-title"><h2>${GROUP_LABELS[group]}</h2><div class="line"></div></div>
      <div class="modules">${mods.map(moduleCardHtml).join('')}</div>
    </div>`;
  }).join('');

  container.querySelectorAll('.module-card').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => enterModule(btn.dataset.module));
  });
}

async function enterModule(mod) {
  const target = MODULE_TARGETS[mod];
  if (!target) return;
  const token = getToken();
  try {
    const res = await fetch(`${QR_API_BASE}/api/auth/handoff`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token },
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      alert(data.error || 'No se pudo abrir el módulo. Intenta de nuevo.');
      return;
    }
    const path = MODULE_HANDOFF_PATH[mod] || '/';
    window.location.href = `${target}${path}?handoff=${encodeURIComponent(data.code)}`;
  } catch (err) {
    alert('No se pudo conectar con el servidor.');
  }
}

(async function init() {
  const token = getToken();
  if (!token) { goToLogin(); return; }

  try {
    const res = await fetch(`${QR_API_BASE}/api/auth/me`, { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { localStorage.removeItem('qubira_token'); localStorage.removeItem('qubira_user'); goToLogin(); return; }
    const data = await res.json();
    localStorage.setItem('qubira_user', JSON.stringify(data.user));
    renderSession(data.user);
    renderModules(data.user.authorized_modules || []);
  } catch (err) {
    document.getElementById('modules-container').className = 'empty-state';
    document.getElementById('modules-container').innerHTML = '<strong>No se pudo conectar con la API.</strong>';
  }
})();
</script>
</body>
</html>
